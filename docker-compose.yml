x-laravel-environment: &laravel-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost
  APP_KEY: ${APP_KEY:-base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: bus_booking
  DB_USERNAME: bus_booking
  DB_PASSWORD: change-me
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: bus-booking
  REVERB_APP_KEY: local-key
  REVERB_APP_SECRET: change-me
  REVERB_HOST: localhost
  REVERB_PORT: 80
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_SCALING_ENABLED: "true"
  REVERB_ALLOWED_ORIGINS: http://localhost

x-laravel-service: &laravel-service
  build:
    context: ./backend
  environment: *laravel-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *laravel-service

  queue:
    <<: *laravel-service
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=110

  reverb:
    <<: *laravel-service
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  passenger-web:
    build:
      context: ./frontend/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost/graphql
        NEXT_PUBLIC_REVERB_APP_KEY: local-key
        NEXT_PUBLIC_REVERB_HOST: localhost
        NEXT_PUBLIC_REVERB_PORT: 80
        NEXT_PUBLIC_REVERB_SCHEME: http
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost/graphql
      NEXT_PUBLIC_REVERB_APP_KEY: local-key
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: 80
      NEXT_PUBLIC_REVERB_SCHEME: http
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - passenger-web
      - reverb
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bus_booking
      POSTGRES_USER: bus_booking
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus_booking -d bus_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
