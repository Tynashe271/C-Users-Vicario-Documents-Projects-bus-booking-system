"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Read any enabled transport-platform module with tenant isolation."
    moduleRecords(module: String!, status: String): [PlatformResource!]!
        @field(resolver: "App\\GraphQL\\PlatformModuleResolver")

    tripSearch(origin_terminal_id: ID!, destination_terminal_id: ID!, date: String!): [Trip!]!
        @field(resolver: "App\\GraphQL\\TripSearchResolver")
}

type Trip {
    id: ID!
    company_id: ID!
    route_id: ID!
    bus_id: ID!
    departs_at: DateTime!
    arrives_at: DateTime!
    base_fare: Float!
    currency: String!
    status: String!
}

type PlatformResource {
    id: ID!
    company_id: ID
    user_id: ID
    code: String
    name: String
    status: String!
    amount: Float
    currency: String
    data_json: String @method(name: "dataJson")
    starts_at: DateTime
    ends_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}
